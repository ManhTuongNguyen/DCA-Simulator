services:
  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - static:/api/static:ro
      - media:/api/media:ro
    networks:
      - dca-network
    logging: &default-logging
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  backend:
    <<: &backend-common
      image: manhtuongnguyen/dca-simulation-backend:0.1.4
      restart: unless-stopped
      init: true
      env_file:
        - .env
      networks:
        - dca-network
      logging: *default-logging

    environment:
      DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379
      REDIS_URL: redis://redis:6379

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    expose:
      - '8000'

    volumes:
      - duckdb:/api/data
      - static:/api/static
      - media:/api/media

    command:
      - sh
      - -ec
      - |
        python manage.py migrate
        python manage.py collectstatic --noinput
        python manage.py fetch_symbols

        exec gunicorn stock.asgi:application \
          --worker-class uvicorn.workers.UvicornWorker \
          --bind 0.0.0.0:8000 \
          --workers 1 \
          --timeout 120 \
          --graceful-timeout 30 \
          --worker-tmp-dir /dev/shm \
          --access-logfile - \
          --error-logfile - \
          --log-level info

    healthcheck:
      test: [ 'CMD', '.venv/bin/python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health/")' ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  celery:
    <<: *backend-common

    environment:
      DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379
      REDIS_URL: redis://redis:6379

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - duckdb:/api/data

    command:
      - sh
      - -ec
      - |
        python manage.py migrate_duckdb
        python manage.py import_old_gold_prices

        exec celery -A stock worker \
          -Q normal \
          --concurrency=1 \
          --without-mingle \
          --without-gossip \
          --without-heartbeat \
          --loglevel=info

  web:
    image: manhtuongnguyen/dca-simulation-web:0.1.4
    restart: unless-stopped
    init: true

    expose:
      - '80'

    healthcheck:
      test: [ 'CMD', 'wget', '-qO-', 'http://127.0.0.1/' ]
      interval: 30s
      timeout: 5s
      retries: 3

    networks:
      - dca-network

    logging: *default-logging

  db:
    image: postgres:16-alpine
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${DB_NAME:-stockchart}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}' ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - dca-network

    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - 'no'
      - --save
      - ''

    volumes:
      - redis_data:/data

    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - dca-network

    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  duckdb:
  static:
  media:

networks:
  dca-network:
    driver: bridge
